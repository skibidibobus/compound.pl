name: Aktualizacja danych rynkowych compound.pl

on:
  schedule:
    # Harmonogram cyklicznej aktualizacji co 30 minut
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aktualizacja notowań i depesz (fetcher.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 fetcher.py

      - name: Zapis zaktualizowanej migawki data.json
        run: |
          git config --local user.email "bot@compound.pl"
          git config --local user.name "compound.pl Bot"
          git add data.json
          git diff --staged --quiet || (git commit -m "chore(data): aktualizacja notowan i depesz" && git push)
