name: compound.pl — Auto-Update Market & News Stream

on:
  schedule:
    # Uruchamianie automatyczne co 30 minut przez całą dobę (0 zł w ramach GitHub Actions)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Możliwość ręcznego wywołania jednym kliknięciem w zakładce Actions

permissions:
  contents: write

jobs:
  update-stream:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aktualizuj strumienie rynkowe i analizę AI (fetcher.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 fetcher.py

      - name: Zapisz zaktualizowany snapshot data.json (Static CDN Trigger)
        run: |
          git config --local user.email "bot@compound.pl"
          git config --local user.name "compound.pl Bot"
          git add data.json
          git diff --staged --quiet || (git commit -m "chore(stream): auto-update market & news data.json" && git push)
